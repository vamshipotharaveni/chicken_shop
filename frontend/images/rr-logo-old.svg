<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="rrGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="rrRubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="45%" stop-color="#E11D48" />
      <stop offset="85%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="rrBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="rrCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </radialGradient>
    <filter id="rrShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="rrTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Ambient Glow & Badge Body -->
  <circle cx="80" cy="80" r="76" fill="url(#rrBgGrad)" filter="url(#rrShadow)" />
  <circle cx="80" cy="80" r="70" fill="url(#rrCenterGlow)" />

  <!-- Double Metallic Ring -->
  <circle cx="80" cy="80" r="74" fill="none" stroke="url(#rrGoldGrad)" stroke-width="3" />
  <circle cx="80" cy="80" r="68" fill="none" stroke="url(#rrRubyGrad)" stroke-width="1.8" stroke-dasharray="3.5 2" opacity="0.9" />

  <!-- Royal Crown Motif -->
  <g transform="translate(80, 26)" filter="url(#rrShadow)">
    <path d="M-18,12 L-11,2 L0,8 L11,2 L18,12 Z" fill="url(#rrGoldGrad)" />
    <circle cx="-11" cy="0" r="2.2" fill="#FEF08A" />
    <circle cx="0" cy="6" r="2.2" fill="#FEF08A" />
    <circle cx="11" cy="0" r="2.2" fill="#FEF08A" />
  </g>

  <!-- Bold Luxury Interlocking 'RR' Monogram -->
  <text x="64" y="98" font-family="'Outfit', 'Georgia', serif" font-weight="900" font-size="54" text-anchor="middle" letter-spacing="-2" fill="url(#rrRubyGrad)" filter="url(#rrTextGlow)">R</text>
  <text x="96" y="98" font-family="'Outfit', 'Georgia', serif" font-weight="900" font-size="54" text-anchor="middle" letter-spacing="-2" fill="url(#rrGoldGrad)" filter="url(#rrTextGlow)">R</text>

  <!-- Bottom Arch Ribbon Label -->
  <path id="ribbonPath" d="M 30,134 Q 80,154 130,134" fill="none" stroke="none" />
  <text font-family="'Inter', sans-serif" font-size="9" font-weight="800" letter-spacing="2.5" fill="url(#rrGoldGrad)" filter="url(#rrTextGlow)">
    <textPath href="#ribbonPath" startOffset="50%" text-anchor="middle">
      CHICKEN CENTER
    </textPath>
  </text>
</svg>
